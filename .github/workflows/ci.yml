name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unnomada
          POSTGRES_PASSWORD: unnomada_ci
          POSTGRES_DB: unnomada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unnomada -d unnomada_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://unnomada:unnomada_ci@localhost:5432/unnomada_test?schema=public
      SESSION_SECRET: ci-session-secret-minimum-32-characters-long
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database schema
        run: npx prisma db push --skip-generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
