name: Deploy production

on:
  push:
    branches:
      - deploy/2026-prod
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy/2026-prod' || github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Escribir clave desde env (mejor con multilínea) y normalizar saltos de línea
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Validación básica sin filtrar el secreto
          lines=$(wc -l < ~/.ssh/deploy_key | tr -d ' ')
          bytes=$(wc -c < ~/.ssh/deploy_key | tr -d ' ')
          echo "deploy_key lines=$lines bytes=$bytes"
          head -1 ~/.ssh/deploy_key | grep -q 'BEGIN.*PRIVATE KEY' || {
            echo "::error::DEPLOY_SSH_KEY no parece una clave privada OPENSSH/PEM (falta BEGIN PRIVATE KEY)"
            exit 1
          }
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'echo SSH_OK'

      - name: Sync files to droplet
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude 'prisma/dev.db' \
            --exclude 'prisma/dev.db-journal' \
            --exclude 'public/uploads/' \
            --exclude '.cursor/' \
            --exclude 'dev.log' \
            --exclude 'server.log' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Build and restart on server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x ${DEPLOY_PATH}/deploy/remote-build.sh && ${DEPLOY_PATH}/deploy/remote-build.sh"
