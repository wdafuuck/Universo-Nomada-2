name: Deploy production

on:
  push:
    branches:
      - deploy/2026-prod
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy/2026-prod' || github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          echo "host_chars=${#DEPLOY_HOST} user_chars=${#DEPLOY_USER} path_chars=${#DEPLOY_PATH} key_chars=${#DEPLOY_SSH_KEY}"
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY vacío"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Acepta clave PEM/OPENSSH multilínea O base64 de una sola línea
          if printf '%s' "$DEPLOY_SSH_KEY" | grep -q 'BEGIN.*PRIVATE KEY'; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r\n ' | base64 --decode > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          echo "deploy_key_bytes=$(wc -c < ~/.ssh/deploy_key | tr -d ' ')"
          head -1 ~/.ssh/deploy_key | grep -q 'BEGIN.*PRIVATE KEY' || {
            echo "::error::La clave no es válida. Re-pega DEPLOY_SSH_KEY (mejor en base64, ver DEPLOY.md)"
            exit 1
          }

          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'echo SSH_OK'

      - name: Sync files to droplet
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude 'prisma/dev.db' \
            --exclude 'prisma/dev.db-journal' \
            --exclude 'public/uploads/' \
            --exclude '.cursor/' \
            --exclude 'dev.log' \
            --exclude 'server.log' \
            --exclude 'docker-compose.yml' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Build and restart on server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x ${DEPLOY_PATH}/deploy/remote-build.sh && ${DEPLOY_PATH}/deploy/remote-build.sh"
